apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-agent-devops
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: multi-agent-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multi-agent-devops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multi-agent-devops
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: multi-agent-devops
                topologyKey: kubernetes.io/hostname
      containers:
        - name: multi-agent-devops
          image: multi-agent-devops:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef:
                  name: multi-agent-devops-secret
                  key: OLLAMA_HOST
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
